   </g>
   <g id="text_10">
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(317.311873 54.81786)">Code checks the</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(319.026592 63.664401)">result against a</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(320.912436 73.435942)">key or hidden</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(320.312342 84.030733)">tests: score 0-1</text>
   </g>
