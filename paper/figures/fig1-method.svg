   </g>
   <g id="text_2">
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(15.477674 53.896907)">A prompt and</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(15.529705 63.662667)">made-up files,</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(16.196283 73.437677)">copied from a</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(26.853439 83.214421)">real job</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Palatino Linotype'; text-anchor: middle; fill: #2b2b2b" x="115.10604" y="31.38404" transform="rotate(-0 115.10604 31.38404)">2. The set-up</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(88.948196 53.896907)">One laptop, one</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(93.691134 64.59287)">Claude Code</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(97.002056 73.764896)">version, no</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(87.556649 83.210952)">personal settings</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Palatino Linotype'; text-anchor: middle; fill: #2b2b2b" x="191.34" y="31.38404" transform="rotate(-0 191.34 31.38404)">3. The model</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(167.544375 58.775162)">Named by full</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(164.542172 69.025391)">identifier, at one</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(170.616531 78.32865)">effort setting</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'Palatino Linotype'; text-anchor: middle; fill: #2b2b2b" x="267.57396" y="31.38404" transform="rotate(-0 267.57396 31.38404)">4. The run</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(243.714163 54.361142)">Time, cost and</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(244.749585 63.660933)">output tokens</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(251.299741 73.435942)">logged by</text>
    <text style="font-size: 7.4px; font-family: 'Palatino Linotype'; fill: #2b2b2b" transform="translate(246.159054 84.14289)">Claude Code</text>
   </g>
   <g id="text_9">
